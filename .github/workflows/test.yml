name: FocusFlow Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:

    runs-on: macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: |
          xcodebuild test \
          -scheme FocusFlow \
          -destination 'platform=iOS Simulator,name=iPhone 16'
